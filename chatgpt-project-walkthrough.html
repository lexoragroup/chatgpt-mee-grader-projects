<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEE Grader Setup - ChatGPT Project Walkthrough</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    background: #0d0f12;
    color: #e7e7e2;
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  button, input, textarea { font: inherit; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  .wrap { min-height: 100vh; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab {
    border: 1px solid #293036;
    background: #15191e;
    color: #8c969f;
    border-radius: 8px;
    padding: 8px 13px;
    font-size: 12px;
    cursor: pointer;
  }
  .tab.active { background: #19c37d; border-color: #19c37d; color: #06130d; font-weight: 800; }
  .browser {
    height: 520px;
    border: 1px solid #263039;
    border-radius: 14px;
    overflow: hidden;
    background: #101418;
    box-shadow: 0 32px 80px rgba(0,0,0,.42);
  }
  .chrome {
    height: 38px;
    background: #0f1216;
    border-bottom: 1px solid #222b33;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 14px;
  }
  .dot { width: 11px; height: 11px; border-radius: 99px; }
  .url { flex: 1; text-align: center; color: #56616b; font-size: 12px; }
  .app { height: calc(100% - 38px); display: flex; overflow: hidden; }
  .side {
    width: 238px;
    background: #111418;
    border-right: 1px solid #222b33;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .brand { padding: 16px 14px 8px; display: flex; align-items: center; gap: 9px; }
  .mark {
    width: 28px; height: 28px; border-radius: 7px; background: #19c37d;
    color: #07130e; display: grid; place-items: center; font-weight: 900;
  }
  .new-chat { margin: 4px 10px 8px; border: 1px solid #2b343d; border-radius: 9px; padding: 8px 12px; color: #a8b0b7; font-size: 13px; }
  .nav-label { color: #67727b; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 800; padding: 12px 14px 5px; }
  .project-row, .muted-row {
    margin: 2px 8px;
    padding: 8px 10px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  .project-row { background: #183227; border: 1px solid #24513e; color: #e9fff4; }
  .muted-row { color: #6f7982; }
  .profile {
    margin-top: auto;
    padding: 12px 10px;
    border-top: 1px solid #20272e;
    display: flex;
    align-items: center;
    gap: 8px;
    color: #7c878f;
    font-size: 13px;
  }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: #20362d; color: #19c37d; display: grid; place-items: center; font-weight: 800; }
  .main { flex: 1; background: #161b20; overflow: hidden; display: flex; flex-direction: column; }
  .top { padding: 16px 22px; border-bottom: 1px solid #222b33; display: flex; align-items: center; gap: 9px; }
  .content { flex: 1; overflow: auto; padding: 22px 28px; }
  .modal-layer { position: absolute; inset: 38px 0 0 238px; background: rgba(0,0,0,.55); display: grid; place-items: center; backdrop-filter: blur(2px); }
  .modal, .panel {
    background: #1c2228;
    border: 1px solid #303a44;
    border-radius: 14px;
    box-shadow: 0 22px 60px rgba(0,0,0,.45);
  }
  .modal { width: 390px; padding: 26px 28px; }
  .field-label { color: #9aa5ad; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
  .field {
    background: #11161a; border: 1px solid #2d3740; border-radius: 9px; padding: 10px 12px;
    color: #e7e7e2; font-size: 13px; margin-bottom: 14px;
  }
  .field.focus { border: 2px solid #19c37d; box-shadow: 0 0 0 4px rgba(25,195,125,.13); display: flex; justify-content: space-between; }
  .cursor { width: 2px; height: 16px; background: #19c37d; animation: blink 1s infinite; }
  .btn { border-radius: 8px; padding: 8px 16px; font-size: 12px; border: 1px solid #34404a; background: transparent; color: #96a1aa; }
  .btn.primary { background: #19c37d; border-color: #19c37d; color: #07130e; font-weight: 800; }
  .split { display: grid; grid-template-columns: 315px 1fr; height: 100%; }
  .settings { border-right: 1px solid #222b33; padding: 18px; overflow: auto; }
  .card {
    background: #1c2228; border: 1px solid #2b343d; border-radius: 12px; padding: 14px; margin-bottom: 12px;
  }
  .card.hot { border: 2px solid #19c37d; box-shadow: 0 0 0 4px rgba(25,195,125,.12); }
  .badge { background: #19c37d; color: #07130e; font-size: 10px; font-weight: 900; border-radius: 5px; padding: 2px 7px; }
  .mono {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px;
    line-height: 1.65;
    color: #bac3ca;
  }
  .file { display: flex; align-items: center; gap: 10px; padding: 9px 10px; background: #11161a; border: 1px solid #27313a; border-radius: 9px; margin-bottom: 7px; }
  .file-info { flex: 1; }
  .file-title { color: #dce4ea; font-size: 12px; font-weight: 650; }
  .file-sub { color: #66717a; font-size: 11px; margin-top: 2px; }
  .chat { max-width: 760px; margin: 0 auto; }
  .bubble { display: flex; gap: 10px; margin-bottom: 16px; }
  .assistant-mark { width: 28px; height: 28px; border-radius: 7px; background: #19c37d; color: #07130e; display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
  .user-mark { width: 28px; height: 28px; border-radius: 50%; background: #20362d; color: #19c37d; display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
  .bubble-body { flex: 1; color: #d4dbe0; font-size: 13px; line-height: 1.65; }
  .summary { background: #11161a; border: 2px solid #19c37d; border-radius: 12px; padding: 14px 16px; }
  .footer-note { text-align: center; color: #19c37d; font-size: 12px; font-weight: 750; }
  @media (max-width: 760px) {
    .wrap { padding: 12px; }
    .browser { height: 580px; }
    .side { width: 160px; }
    .modal-layer { left: 160px; }
    .split { grid-template-columns: 1fr; }
    .settings { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="browser">
    <div class="chrome">
      <span class="dot" style="background:#ff5f57"></span>
      <span class="dot" style="background:#febc2e"></span>
      <span class="dot" style="background:#28c840"></span>
      <div class="url">chatgpt.com/projects</div>
    </div>
    <div class="app" id="app"></div>
  </div>
  <div class="footer-note" id="caption"></div>
</div>
<script>
const steps = [
  ["Step 1", "Create a ChatGPT Project"],
  ["Step 2", "Add Project Instructions"],
  ["Step 3", "Upload Project Files"],
  ["Step 4", "Grade One Essay Per Chat"],
  ["Step 5", "Use Project Context Carefully"]
];
let active = 0;

function sidebar(project=true) {
  return `
  <aside class="side">
    <div class="brand"><div class="mark">◎</div><strong>ChatGPT</strong></div>
    <div class="new-chat">+ New chat</div>
    <div class="nav-label">Projects</div>
    ${project ? `<div class="project-row">📝 <span>MEE Grader</span></div>` : `<div class="muted-row" style="border:1px solid #19c37d;color:#19c37d">+ New project</div>`}
    <div class="muted-row">📁 Bar Exam Notes</div>
    <div class="nav-label">Recents</div>
    <div class="muted-row">ConLaw essay feedback</div>
    <div class="muted-row">MEE practice plan</div>
    <div class="muted-row">Contracts rule check</div>
    <div class="profile"><div class="avatar">Y</div><span>Your Lawyer Bestie</span></div>
  </aside>`;
}

function step1() {
  return `
  ${sidebar(false)}
  <main class="main" style="position:relative">
    <div class="top"><strong>Projects</strong></div>
    <div class="modal-layer">
      <div class="modal">
        <h2 style="font-size:18px;margin-bottom:6px">New Project</h2>
        <p style="color:#84909a;font-size:13px;line-height:1.5;margin-bottom:18px">Projects keep your files, chats, and instructions together in one workspace.</p>
        <div class="field-label">Project name</div>
        <div class="field focus"><span>MEE Grader</span><span class="cursor"></span></div>
        <div class="field-label">Memory setting</div>
        <div class="field">Project-only memory for focused bar prep context</div>
        <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn">Cancel</button><button class="btn primary">Create project</button></div>
      </div>
    </div>
  </main>`;
}

function step2() {
  return `
  ${sidebar()}
  <main class="main">
    <div class="top">📝 <strong>MEE Grader</strong></div>
    <div class="split">
      <section class="settings">
        <p style="color:#7e8992;font-size:12px;line-height:1.5;margin-bottom:14px">Project instructions apply to every new chat inside this project.</p>
        <div class="card hot">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div class="field-label" style="margin:0">Project instructions</div><span class="badge">PASTE HERE</span>
          </div>
          <p style="color:#66717a;font-size:12px;line-height:1.5">Paste the ChatGPT founding prompt here so every essay chat starts with the same grader rules.</p>
        </div>
        <div class="card"><div class="field-label">Files</div><p style="color:#66717a;font-size:12px">No project files yet</p></div>
      </section>
      <section class="content">
        <div class="card hot">
          <div class="field-label" style="color:#19c37d">Editing instructions</div>
          <div class="mono">
            <span style="color:#79d6a5">You are a private MEE essay grader</span> for a UBE bar exam retaker. You grade on a
            <strong style="color:#19c37d">1-6 scale</strong> calibrated to a <strong style="color:#19c37d">270 UBE passing score</strong>.
            You never soften scores. You never round up. <em style="color:#f0c96b">A 3 is a 3.</em><br><br>
            At the start of every new conversation, ask three questions before grading:<br>
            <span style="color:#8ab4d4">1. What jurisdiction are you in?</span><br>
            <span style="color:#8ab4d4">2. What subject area is this essay?</span><br>
            <span style="color:#8ab4d4">3. Was this a timed attempt?</span><br><br>
            <span style="color:#66717a">Wait for answers to all three before proceeding...</span>
          </div>
          <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="btn">Cancel</button><button class="btn primary">Save</button></div>
        </div>
      </section>
    </div>
  </main>`;
}

function step3() {
  const files = [
    ["NCBE_MEE_Subject_Matter_Outline.pdf", "official outline", "done"],
    ["July_2025_MEE_Sample_Questions.pdf", "sample questions", "done"],
    ["Maryland_Representative_Good_Answers.pdf", "jurisdiction answers", "done"],
    ["Washington_State_MEE_Rubric.pdf", "rubric", "uploading"]
  ];
  return `
  ${sidebar()}
  <main class="main">
    <div class="top">📝 <strong>MEE Grader</strong></div>
    <section class="content">
      <div class="card" style="display:flex;justify-content:space-between"><span style="color:#7e8992">Project instructions</span><strong style="color:#19c37d">Saved</strong></div>
      <div class="card hot">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <div class="field-label" style="margin:0">Project files</div><button class="btn primary">Upload files</button>
        </div>
        ${files.map(f => `
        <div class="file">
          <span>📄</span><div class="file-info"><div class="file-title">${f[0]}</div><div class="file-sub">${f[1]}</div></div>
          ${f[2] === "done" ? `<strong style="color:#19c37d">✓</strong>` : `<span style="color:#19c37d">Uploading...</span>`}
        </div>`).join("")}
      </div>
    </section>
  </main>`;
}

function step4() {
  return `
  ${sidebar()}
  <main class="main">
    <div class="top">📝 <strong>MEE Grader</strong><span style="color:#56616b">› Contracts essay - fresh chat</span></div>
    <section class="content chat">
      <div class="bubble"><div class="assistant-mark">◎</div><div class="bubble-body">Before I grade, answer three things: jurisdiction, subject area, and whether this was timed.</div></div>
      <div class="bubble" style="justify-content:flex-end"><div class="bubble-body" style="max-width:70%;background:#20272e;border:1px solid #303a44;border-radius:12px;padding:12px">DC bar. Contracts. Timed - 30 minutes.<br><span style="color:#84909a">[essay pasted below]</span></div><div class="user-mark">Y</div></div>
      <div class="bubble"><div class="assistant-mark">◎</div><div class="bubble-body"><div class="summary mono"><strong style="color:#19c37d">ISSUE SPOTTING</strong><br>Correctly identified: offer, acceptance, consideration.<br><span style="color:#f0a0a0">Missed: UCC Article 2 threshold and battle of the forms.</span><br><br><strong style="color:#f0c96b">OVERALL SCORE: 3.5/6</strong><br>STATUS: Borderline<br><br>SESSION SUMMARY block appears at the end. Copy it into your Error Log if tracking progress.</div></div></div>
    </section>
  </main>`;
}

function step5() {
  return `
  ${sidebar()}
  <main class="main">
    <div class="top">📝 <strong>MEE Grader</strong><span style="color:#56616b">› Progress review</span></div>
    <section class="content chat">
      <div class="card hot">
        <div class="field-label" style="color:#19c37d">Project context is helpful, not gospel</div>
        <p style="color:#cfd7dc;font-size:13px;line-height:1.65">Project memory may help ChatGPT notice patterns across chats and uploaded files. For serious tracking, your Error Log is still the clean record.</p>
      </div>
      <div class="bubble" style="justify-content:flex-end"><div class="bubble-body" style="max-width:72%;background:#20272e;border:1px solid #303a44;border-radius:12px;padding:12px">Give me my progress report. Use the uploaded Error Log.</div><div class="user-mark">Y</div></div>
      <div class="bubble"><div class="assistant-mark">◎</div><div class="bubble-body"><div class="summary mono"><strong style="color:#19c37d">PROGRESS REPORT</strong><br>Score trend: 3.0 → 3.5 → 4.0<br>Most common issue: conclusory application after spotting the correct doctrine.<br>Next two-week focus: Contracts UCC/common law threshold + Evidence hearsay exceptions.</div></div></div>
    </section>
  </main>`;
}

const renderers = [step1, step2, step3, step4, step5];
function render() {
  document.getElementById("tabs").innerHTML = steps.map((s, i) =>
    `<button class="tab ${i === active ? "active" : ""}" onclick="active=${i};render()">${s[0]}: ${s[1]}</button>`
  ).join("");
  document.getElementById("app").innerHTML = renderers[active]();
  document.getElementById("caption").innerHTML = `<span>${steps[active][0]}:</span> ${steps[active][1]}`;
}
render();
</script>
</body>
</html>
